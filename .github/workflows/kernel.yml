name: kernel-419

# 目标：编出与 OPPO PDNM00（SM7250 / lito，uname -r = 4.19.157-perf+）ABI 对齐、
# 但关掉强制模块签名与符号 CRC 的内核 Image，用来 insmod 改过的 fuck1337 模块。
#
# 关键三改：
#   CONFIG_MODULE_SIG_FORCE  → n   （不再要求厂商密钥签名）
#   CONFIG_MODULE_SIG_ALL    → n   （不签名，省掉 openssl 那套）
#   CONFIG_MODVERSIONS       → n   （不再校验 .ko 的 __versions 符号 CRC）
# 保持 CONFIG_LOCALVERSION="-perf"，让 uname -r 仍是 4.19.157-perf+
#
# 2026-11-05 修正：
#   1) nullify 掉 CONFIG_DEBUG_INFO（几 GB 调试信息，纯耗时，不影响 ABI）
#   2) 只编 Image，不编 dtbs（dtbo 分区不动，dtb 用不上）
#   3) 加 ccache + actions/cache：单次 6 小时上限内编不完时，下次接着编
#   4) config 后立刻断言 CONFIG_64BIT/ARM64/MODULES，避免带着坏 config 白跑 5 小时
#      （上一轮 kernel/bounds.s 报 atomic64_t 未定义，就是 CONFIG_64BIT 没生效）

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: '并行度（public 仓库建议 4，private 用 2）'
        required: false
        default: '4'
      kernel_repo:
        description: '上游内核仓库'
        required: false
        default: 'https://github.com/oppo-source/android_kernel_oppo_sm7250.git'
      kernel_branch:
        description: '上游分支'
        required: false
        default: 'oppo/sm7250_s_12.1_reno4_5g'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      ARCH: arm64
      SUBARCH: arm64
      JOBS: ${{ github.event.inputs.jobs || '4' }}
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev device-tree-compiler \
            cpio gzip xz-utils zstd python3 rsync ca-certificates ccache
          # 优先 gcc-10（对 4.19 最友好），没有就退回 gcc-11 / 默认版本
          sudo apt-get install -y --no-install-recommends gcc-10-aarch64-linux-gnu \
            || sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
          for c in aarch64-linux-gnu-gcc-10 aarch64-linux-gnu-gcc-11 aarch64-linux-gnu-gcc; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CROSS_CC=$c" >> "$GITHUB_ENV"
              break
            fi
          done
          echo "选中编译器: $(command -v "$CROSS_CC" || true)"
          "$CROSS_CC" --version | head -1
          ccache --version | head -1

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ github.event.inputs.kernel_branch }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.event.inputs.kernel_branch }}-${{ github.sha }}-
            ccache-${{ github.event.inputs.kernel_branch }}-

      - name: 拉取内核源码
        run: |
          git clone --depth 1 --single-branch \
            --branch "${{ github.event.inputs.kernel_branch }}" \
            "${{ github.event.inputs.kernel_repo }}" ksrc
          git clone --depth 1 --single-branch \
            --branch "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm7250.git source
          # 两个上游仓库共同组成 kernel/msm-4.19 + vendor 的源码布局。
          rsync -a --ignore-existing source/kernel/msm-4.19/ ksrc/
          mv source/kernel/msm-4.19 source/kernel/vendor-overlay
          mv ksrc source/kernel/msm-4.19
          ln -s source/kernel/msm-4.19 ksrc
          ln -sfn "$GITHUB_WORKSPACE/source/vendor/oplus/kernel/wakelock_profiler" ksrc/drivers/soc/oplus/owakelock
          ln -sfn "$GITHUB_WORKSPACE/source/vendor/oplus/kernel/wakelock_profiler/oplus_wakelock_profiler.h" ksrc/include/soc/oplus/oplus_wakelock_profiler.h
          echo "vendor HEAD: $(git -C source rev-parse HEAD)"
          test -f ksrc/drivers/input/touchscreen/oplus_touchscreen/Kconfig
          test -f ksrc/kernel/sched_assist/Makefile
          test -f ksrc/include/soc/oplus/system/boot_mode.h
          git -C source -c core.autocrlf=true apply "$GITHUB_WORKSPACE/compat/vendor-guards.patch"
          cd ksrc
          echo "HEAD: $(git rev-parse HEAD)"
          du -sh .git .
          df -h /

      - name: 修补公开源码缺失项
        run: |
          chmod +x compat/*.sh
          ./compat/prep_source.sh ksrc

      - name: 打厂商符号补丁
        run: |
          ./compat/apply_compat.sh ksrc

      - name: 以设备真实配置为基线生成 .config
        run: |
          cd ksrc
          cp "$GITHUB_WORKSPACE/config/device.config" .config
          scripts/config --file .config -d MODULE_SIG_FORCE
          scripts/config --file .config -d MODULE_SIG_ALL
          scripts/config --file .config -d MODVERSIONS
          scripts/config --file .config -d DEBUG_INFO
          scripts/config --file .config --set-str LOCALVERSION "-perf"
          scripts/config --file .config -e MODULES
          if [ ! -f kernel/sched_assist/Makefile ]; then
            scripts/config --file .config -d OPLUS_FEATURE_SCHED_ASSIST
          fi
          scripts/config --file .config -d OPLUS_SECURE_GUARD
          make ARCH=arm64 CC="$CROSS_CC" HOSTCC=gcc olddefconfig
          echo "==== 关键项 ===="
          grep -E '^CONFIG_MODULE_SIG|^# CONFIG_MODULE_SIG|MODVERSIONS|^CONFIG_LOCALVERSION=|^CONFIG_MODULES=|^CONFIG_64BIT|^CONFIG_ARM64=|^CONFIG_DEBUG_INFO' .config
          echo "==== 断言：这三项没了就不用往下跑了 ===="
          for k in CONFIG_64BIT CONFIG_ARM64 CONFIG_MODULES CONFIG_TOUCHPANEL_OPLUS CONFIG_DRM_MSM CONFIG_SCSI_UFS_QCOM CONFIG_WLAN CONFIG_CNSS_UTILS; do
            grep -q "^${k}=y" .config || { echo "::error::${k} 未生效，配置基线有问题"; exit 1; }
          done
          echo "OK"

      - name: 生成头文件并冒烟编译 bounds.s
        run: |
          set -o pipefail
          cd ksrc
          echo "==== 诊断：-k 跑完全部 prepare，把所有缺失头文件一次性收齐 ===="
          make -k -j"$JOBS" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               CC="ccache $CROSS_CC" HOSTCC=gcc KCFLAGS="-Wno-error" \
               prepare > "$GITHUB_WORKSPACE/prepare.log" 2>&1 || true
          grep -oE 'fatal error: [^:]+: No such file' "$GITHUB_WORKSPACE/prepare.log" | sed 's/fatal error: //' | sort -u || true
          echo "==== autoconf.h 里的 64BIT ===="
          grep -E 'CONFIG_64BIT' include/generated/autoconf.h || echo "!! autoconf.h 里没有 CONFIG_64BIT"
          echo "==== kernel.release ===="
          cat include/config/kernel.release || true
          echo "==== 冒烟：单独编 kernel/bounds.s（10 分钟内必须过）===="
          timeout 600 make -j"$JOBS" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               CC="ccache $CROSS_CC" HOSTCC=gcc KCFLAGS="-Wno-error" \
               kernel/bounds.s 2>&1 | tee "$GITHUB_WORKSPACE/smoke.log" | tail -30
          echo "冒烟通过"

      - name: 编译 Image
        run: |
          set -o pipefail
          cd ksrc
          export CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime
          timeout 19500 make -j"$JOBS" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               CC="ccache $CROSS_CC" HOSTCC="ccache gcc" KCFLAGS="-Wno-error" \
               --output-sync=target Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -5
          ls -l arch/arm64/boot/Image
          ccache -s | head -12

      - name: 核对符号与 vermagic
        run: |
          cd ksrc
          echo "== 厂商符号是否导出（必须两行）=="
          grep -E 'kmalloc_debug_(enable|caches)' Module.symvers || {
            echo "::error::厂商符号未导出，模块会 Unknown symbol"; exit 1; }
          echo "== vmlinux 里是否真的存在 =="
          nm vmlinux | grep -E 'kmalloc_debug_(enable|caches)' || true
          echo "== kernel release =="
          cat include/config/kernel.release
          echo "== 预期 vermagic =="
          echo "$(cat include/config/kernel.release) SMP preempt mod_unload aarch64"
          echo "== Image 头 =="
          python3 -c "d=open('arch/arm64/boot/Image','rb').read(); print(len(d), d[0x38:0x3c])"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-419-image
          path: |
            ksrc/arch/arm64/boot/Image
            ksrc/Module.symvers
            ksrc/.config
            ksrc/include/config/kernel.release
            ksrc/include/generated/autoconf.h
            build.log
            smoke.log
            prepare.log
          if-no-files-found: warn
          include-hidden-files: true

      - name: 保存 ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ github.event.inputs.kernel_branch }}-${{ github.sha }}-${{ github.run_id }}
